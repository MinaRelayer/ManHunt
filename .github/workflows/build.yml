name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew clean test jar

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: manhunt-jar
          path: build/libs/ManHunt-*.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate tag version
        shell: bash
        run: |
          project_version="$(sed -n 's/^version *= *//p' gradle.properties)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ -z "$project_version" || "$project_version" != "$tag_version" ]]; then
            echo "Tag version ($tag_version) does not match Gradle version ($project_version)."
            exit 1
          fi

      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: manhunt-jar
          path: build/libs

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "ManHunt $GITHUB_REF_NAME" \
            --generate-notes \
            build/libs/ManHunt-*.jar
