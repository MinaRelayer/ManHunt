name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew clean test jar

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: manhunt-jar
          path: build/libs/ManHunt-*.jar

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          project_version="$(sed -n 's/^version *= *//p' gradle.properties)"
          release_tag="v${project_version}"
          if [[ -z "$project_version" ]]; then
            echo "Gradle project version is empty."
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$release_tag" ]]; then
            echo "Tag version ($GITHUB_REF_NAME) does not match Gradle version ($project_version)."
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: manhunt-jar
          path: build/libs

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" build/libs/ManHunt-*.jar --clobber
            gh release edit "$RELEASE_TAG" --title "ManHunt $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --title "ManHunt $RELEASE_TAG" \
              --generate-notes \
              build/libs/ManHunt-*.jar
          fi
